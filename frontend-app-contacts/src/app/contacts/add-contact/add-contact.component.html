<form [formGroup]="formModel">
    <mat-form-field appearance="outline">
        <mat-label >nazwisko</mat-label>
        <input matInput placeholder="nazwisko" formControlName="surname">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>imie</mat-label>
        <input matInput placeholder="imie" formControlName="name">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>miasto</mat-label>
        <input matInput placeholder="miaso" formControlName="city">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>numer telefonu</mat-label>
        <input matInput placeholder="numer telefonu" formControlName="phoneNumber">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>email</mat-label>
        <input matInput placeholder="email" formControlName="email">
    </mat-form-field>
</form>
<button [routerLink]="['']">
  <mat-icon>arrow_back</mat-icon>
</button>

<button (click)="saveData()" mat-fab matTooltip = "saveData" [disabled] ="formModel.invalid">
  <mat-icon>save</mat-icon>
</button>

<pre>
  {{formModel.invalid | json}} <! invalid przechowuje prawda lub falsz !>
  {{formModel.status | json}}
  {{formModel.value| json}}
</pre>
